name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - ".github/actions/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (dev or prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'dev' || github.event.inputs.environment }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: terraform/environments/${{ github.event_name == 'pull_request' && 'dev' || github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/${{ github.event_name == 'pull_request' && 'dev' || github.event.inputs.environment }}
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      # Capture output properly
      - name: Terraform Plan
        run: |
          echo "### Terraform Plan Summary" > plan.txt
          terraform plan -no-color | tee -a plan.txt

      # Proper PR comment
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: terraform/environments/dev/plan.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
