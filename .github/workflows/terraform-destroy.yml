name: Terraform Destroy (Controlled)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev or prod)"
        required: true
        type: choice
        options:
          - dev
          - prod

      confirm:
        description: "Type 'destroy' to confirm"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy-plan:
    name: Destroy Plan
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Destroy Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/${{ github.event.inputs.environment }}
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Create Destroy Plan
        id: terraform_destroy_plan
        run: terraform plan -destroy -no-color -out=terraform-destroy.tfplan

      - name: Add Terraform Destroy Plan Summary
        if: always()
        env:
          SUMMARY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          SUMMARY_COMMIT: ${{ github.sha }}
          SUMMARY_ACTOR: ${{ github.actor }}
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAN_OUTCOME: ${{ steps.terraform_destroy_plan.outcome }}
        run: |
          summary_file="${RUNNER_TEMP}/terraform-destroy-plan-summary.md"
          formatter_status=0

          if [ "${PLAN_OUTCOME}" = "success" ] && [ -f terraform-destroy.tfplan ]; then
            set +e
            set -o pipefail
            terraform show -json terraform-destroy.tfplan \
              | python3 "${GITHUB_WORKSPACE}/scripts/render_terraform_summary.py" \
                  --operation plan \
                  --environment "${SUMMARY_ENVIRONMENT}" \
                  --commit "${SUMMARY_COMMIT}" \
                  --actor "${SUMMARY_ACTOR}" \
                  --event "${SUMMARY_EVENT}" \
                  --run-url "${SUMMARY_RUN_URL}" \
                  --run-attempt "${SUMMARY_RUN_ATTEMPT}" \
                  --plan-outcome "${PLAN_OUTCOME}" \
                  > "${summary_file}"
            formatter_status=$?
            set -e
          else
            set +e
            python3 "${GITHUB_WORKSPACE}/scripts/render_terraform_summary.py" \
              --operation plan \
              --environment "${SUMMARY_ENVIRONMENT}" \
              --commit "${SUMMARY_COMMIT}" \
              --actor "${SUMMARY_ACTOR}" \
              --event "${SUMMARY_EVENT}" \
              --run-url "${SUMMARY_RUN_URL}" \
              --run-attempt "${SUMMARY_RUN_ATTEMPT}" \
              --plan-outcome "${PLAN_OUTCOME}" \
              < /dev/null > "${summary_file}"
            formatter_status=$?
            set -e
          fi

          if [ "${formatter_status}" -ne 0 ]; then
            echo "::warning::Unable to render the sanitized Terraform Destroy Plan summary; using a safe fallback."
            {
              echo "## Terraform Destroy Plan Summary"
              echo
              echo "- **Environment:** \`${SUMMARY_ENVIRONMENT}\`"
              echo "- **Plan outcome:** ${PLAN_OUTCOME}"
              echo
              echo "Summary data is unavailable. Inspect the workflow logs for details."
            } > "${summary_file}"
          fi

          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.event.inputs.environment }}
          path: |
            terraform/environments/${{ github.event.inputs.environment }}/terraform-destroy.tfplan
          retention-days: 1

  destroy:
    name: Execute Destroy
    needs: destroy-plan
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/${{ github.event.inputs.environment }}
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Download Reviewed Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.event.inputs.environment }}
          path: terraform/environments/${{ github.event.inputs.environment }}

      - name: Apply Reviewed Destroy Plan
        id: terraform_destroy
        run: |
          set -o pipefail
          terraform apply -no-color -auto-approve terraform-destroy.tfplan \
            | tee "${RUNNER_TEMP}/terraform-destroy-output.txt"

      - name: Add Terraform Destroy Summary
        if: always()
        env:
          SUMMARY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          SUMMARY_COMMIT: ${{ github.sha }}
          SUMMARY_ACTOR: ${{ github.actor }}
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAN_OUTCOME: ${{ needs.destroy-plan.result }}
          EXECUTION_OUTCOME: ${{ steps.terraform_destroy.outcome }}
        run: |
          summary_file="${RUNNER_TEMP}/terraform-destroy-summary.md"
          formatter_status=0
          execution_arguments=()

          if [ -f "${RUNNER_TEMP}/terraform-destroy-output.txt" ]; then
            execution_arguments=(
              --execution-output
              "${RUNNER_TEMP}/terraform-destroy-output.txt"
            )
          fi

          if [ "${PLAN_OUTCOME}" = "success" ] && [ -f terraform-destroy.tfplan ]; then
            set +e
            set -o pipefail
            terraform show -json terraform-destroy.tfplan \
              | python3 "${GITHUB_WORKSPACE}/scripts/render_terraform_summary.py" \
                  --operation destroy \
                  --environment "${SUMMARY_ENVIRONMENT}" \
                  --commit "${SUMMARY_COMMIT}" \
                  --actor "${SUMMARY_ACTOR}" \
                  --event "${SUMMARY_EVENT}" \
                  --run-url "${SUMMARY_RUN_URL}" \
                  --run-attempt "${SUMMARY_RUN_ATTEMPT}" \
                  --plan-outcome "${PLAN_OUTCOME}" \
                  --execution-outcome "${EXECUTION_OUTCOME}" \
                  "${execution_arguments[@]}" \
                  > "${summary_file}"
            formatter_status=$?
            set -e
          else
            set +e
            python3 "${GITHUB_WORKSPACE}/scripts/render_terraform_summary.py" \
              --operation destroy \
              --environment "${SUMMARY_ENVIRONMENT}" \
              --commit "${SUMMARY_COMMIT}" \
              --actor "${SUMMARY_ACTOR}" \
              --event "${SUMMARY_EVENT}" \
              --run-url "${SUMMARY_RUN_URL}" \
              --run-attempt "${SUMMARY_RUN_ATTEMPT}" \
              --plan-outcome "${PLAN_OUTCOME}" \
              --execution-outcome "${EXECUTION_OUTCOME}" \
              "${execution_arguments[@]}" \
              < /dev/null > "${summary_file}"
            formatter_status=$?
            set -e
          fi

          if [ "${formatter_status}" -ne 0 ]; then
            echo "::warning::Unable to render the sanitized Terraform Destroy summary; using a safe fallback."
            {
              echo "## Terraform Destroy Summary"
              echo
              echo "- **Environment:** \`${SUMMARY_ENVIRONMENT}\`"
              echo "- **Plan outcome:** ${PLAN_OUTCOME}"
              echo "- **Destroy outcome:** ${EXECUTION_OUTCOME}"
              echo
              echo "Summary data is unavailable. Inspect the workflow logs for details."
            } > "${summary_file}"
          fi

          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
