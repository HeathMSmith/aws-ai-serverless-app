name: Terraform Destroy (Controlled)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev or prod)"
        required: true
        type: choice
        options:
          - dev
          - prod

      confirm:
        description: "Type 'destroy' to confirm"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy-plan:
    name: Destroy Plan
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Destroy Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/${{ github.event.inputs.environment }}
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Create Destroy Plan
        run: terraform plan -destroy -out=terraform-destroy.tfplan

      - name: Render Destroy Plan
        run: terraform show -no-color terraform-destroy.tfplan | tee destroy-plan.txt

      - name: Add Destroy Plan to Job Summary
        run: |
          {
            echo "## Terraform Destroy Plan"
            echo
            echo "**Environment:** ${{ github.event.inputs.environment }}"
            echo
            echo '```terraform'
            cat destroy-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.event.inputs.environment }}
          path: |
            terraform/environments/${{ github.event.inputs.environment }}/terraform-destroy.tfplan
          retention-days: 1

  destroy:
    name: Execute Destroy
    needs: destroy-plan
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/${{ github.event.inputs.environment }}
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Download Reviewed Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.event.inputs.environment }}
          path: terraform/environments/${{ github.event.inputs.environment }}

      - name: Apply Reviewed Destroy Plan
        run: terraform apply -auto-approve terraform-destroy.tfplan