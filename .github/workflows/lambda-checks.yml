name: Lambda Checks

on:
  pull_request:
    paths:
      - "app/lambda/**"
      - "scripts/package_lambda.py"
      - "tests/**"
      - "terraform/modules/lambda/**"
      - ".github/workflows/lambda-checks.yml"
  push:
    branches:
      - main
    paths:
      - "app/lambda/**"
      - "scripts/package_lambda.py"
      - "tests/**"
      - "terraform/modules/lambda/**"
      - ".github/workflows/lambda-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify Lambda Package
        run: python3 scripts/package_lambda.py check
